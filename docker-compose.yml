version: "3.9"

services:
  backend:
    build: .
    command: sh -c "python migrate.py && python app.py"
    ports:
      - "5000:5000"
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped