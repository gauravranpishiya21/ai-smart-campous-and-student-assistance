<!DOCTYPE html>
<html lang="en" class="dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect</title>
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    <script src="vendor/tailwind.js"></script>
    <style>
        body { background: #f1f5f9; }
        .stat-card { border-radius: 8px; }
        .panel { border-radius: 8px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-700 text-white">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black"><i class="fas fa-satellite-dish mr-2"></i>Campus Connect</h1>
                <p id="ccMe" class="text-sm text-indigo-200 mt-1"></p>
            </div>
            <button id="ccPortalBack" class="bg-white/15 hover:bg-white/25 px-4 py-2 rounded-lg text-sm font-bold transition">
                <i class="fas fa-arrow-left mr-2"></i>Back to my portal
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8">

        <!-- Live summary -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card bg-white p-5 shadow-sm border border-gray-100">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-1"><i class="fas fa-graduation-cap mr-1 text-indigo-500"></i> Students on campus</p>
                <p class="text-3xl font-black text-gray-800" id="ccStudentsIn">-</p>
            </div>
            <div class="stat-card bg-white p-5 shadow-sm border border-gray-100">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-1"><i class="fas fa-chalkboard-user mr-1 text-cyan-500"></i> Faculty &amp; staff in</p>
                <p class="text-3xl font-black text-gray-800" id="ccStaffIn">-</p>
            </div>
            <div class="stat-card bg-white p-5 shadow-sm border border-gray-100">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-1"><i class="fas fa-file-medical mr-1 text-amber-500"></i> Pending leaves</p>
                <p class="text-3xl font-black text-gray-800" id="ccPendingLeaves">-</p>
            </div>
            <div class="stat-card bg-white p-5 shadow-sm border border-gray-100">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-1"><i class="fas fa-sync mr-1 text-emerald-500"></i> Live sync</p>
                <p class="text-sm font-black text-gray-800 mt-2" id="ccLastSync">-</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Students -->
            <div class="panel bg-gray-50 p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-700"><i class="fas fa-users mr-2 text-indigo-500"></i>Students</h2>
                    <span class="text-[10px] font-black uppercase text-gray-400">Presence today</span>
                </div>
                <div id="ccStudents" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>

            <!-- Faculty & Staff -->
            <div class="panel bg-gray-50 p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-700"><i class="fas fa-chalkboard-user mr-2 text-cyan-500"></i>Faculty &amp; Staff</h2>
                    <span class="text-[10px] font-black uppercase text-gray-400">Roll call today</span>
                </div>
                <div id="ccStaff" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
            <!-- Activity -->
            <div class="panel bg-gray-50 p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-700"><i class="fas fa-bolt mr-2 text-amber-500"></i>Live Activity</h2>
                    <span class="text-[10px] font-black uppercase text-gray-400">What just happened</span>
                </div>
                <div id="ccActivity" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>

            <!-- Leaves -->
            <div class="panel bg-gray-50 p-6 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-700"><i class="fas fa-file-medical mr-2 text-rose-500"></i>Leave Queue</h2>
                    <button onclick="loadCampus()" class="text-[10px] font-black text-indigo-600 hover:text-indigo-800"><i class="fas fa-rotate mr-1"></i>Refresh</button>
                </div>
                <div id="ccLeaves" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </main>

    <!-- DM Modal -->
    <div id="dmModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-gray-800"><i class="fas fa-comment-dots text-indigo-500 mr-2"></i><span id="dmLabel">Message</span></h3>
                <button onclick="closeDM()" class="text-gray-400 hover:text-gray-600 text-lg font-bold">&times;</button>
            </div>
            <textarea id="dmBody" class="w-full border border-gray-200 rounded-lg p-3 h-24 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Type your message... (Enter to send)"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button id="dmCancel" class="px-4 py-2 text-sm font-bold text-gray-500 hover:text-gray-700">Cancel</button>
                <button id="dmSend" class="px-4 py-2 text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg"><i class="fas fa-paper-plane mr-2"></i>Send</button>
            </div>
        </div>
    </div>

    <script src="vendor/socket.io.min.js"></script>
    <script src="js/campus.js"></script>
</body>
</html>
