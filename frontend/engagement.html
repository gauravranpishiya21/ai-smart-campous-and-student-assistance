<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Engagement Analytics</title>
    <script src="vendor/tailwind.js"></script>
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold flex items-center gap-3">
                <i class="fas fa-chart-bar text-indigo-600"></i> Classroom Engagement Analytics
            </h1>
            <button onclick="history.back()" class="px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm font-medium hover:bg-slate-100">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </button>
        </div>

        <section class="bg-white border border-slate-200 rounded-lg p-4 mb-6">
            <h2 class="font-semibold mb-3 flex items-center gap-2">
                <i class="fas fa-search text-indigo-500"></i> View Class Analytics
            </h2>
            <div class="flex flex-wrap items-center gap-2">
                <input id="classId" type="number" min="1" class="px-3 py-2 rounded-lg bg-white border border-slate-300 w-40" placeholder="Class ID" />
                <button onclick="loadEngagement()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">
                    <i class="fas fa-search mr-2"></i>Load Analytics
                </button>
            </div>
        </section>

        <div id="analyticsList" class="mb-6"></div>

        <section class="bg-white border border-slate-200 rounded-lg p-6">
            <h2 class="font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-plus-circle text-indigo-500"></i> Submit Engagement Analytics
            </h2>
            <form id="engagementForm" onsubmit="submitEngagement(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="block text-sm">
                    <span class="text-slate-600 mb-1 block">Class ID</span>
                    <input type="number" id="formClassId" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <label class="block text-sm">
                    <span class="text-slate-600 mb-1 block">Faculty ID</span>
                    <input type="number" id="facultyId" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <label class="block text-sm">
                    <span class="text-slate-600 mb-1 block">Date</span>
                    <input type="date" id="date" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <label class="block text-sm">
                    <span class="text-slate-600 mb-1 block">Quiz Participation (%)</span>
                    <input type="number" id="quizParticipation" min="0" max="100" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <label class="block text-sm">
                    <span class="text-slate-600 mb-1 block">Attendance Interaction (%)</span>
                    <input type="number" id="attendanceInteraction" min="0" max="100" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <label class="block text-sm md:col-span-2">
                    <span class="text-slate-600 mb-1 block">Notes</span>
                    <input type="text" id="notes" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300" />
                </label>
                <button type="submit" class="md:col-span-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium">
                    <i class="fas fa-paper-plane mr-2"></i>Submit
                </button>
            </form>
        </section>
    </div>
    <script src="js/engagement.js"></script>
</body>
</html>
