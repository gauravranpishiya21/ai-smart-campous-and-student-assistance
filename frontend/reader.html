<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - CornerStone Library</title>
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    <script src="vendor/tailwind.js"></script>
    <style>
        body { background: #f8fafc; }
        .reader-body { font-size: 17px; line-height: 1.85; color: #1f2937; }
        .reader-body h2 {
            font-size: 1.45em; font-weight: 800; color: #111827;
            margin: 1.6em 0 .55em; padding-bottom: .35em;
            border-bottom: 2px solid #e5e7eb;
        }
        .reader-body p { margin: 0 0 1.05em; }
        .reader-body ul, .reader-body ol { margin: 0 0 1.15em 1.4em; }
        .reader-body li { margin-bottom: .5em; }
        .reader-body code {
            background: #f1f5f9; color: #be123c; padding: .12em .4em;
            border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: .9em;
        }
        .reader-body pre {
            background: #0f172a; color: #e2e8f0; padding: 1.1em 1.3em;
            border-radius: 8px; overflow-x: auto; margin: 0 0 1.3em;
        }
        .reader-body pre code { background: none; color: inherit; padding: 0; font-size: .92em; line-height: 1.6; }
        .reader-body table { width: 100%; border-collapse: collapse; margin: 0 0 1.3em; font-size: .93em; }
        .reader-body th, .reader-body td { border: 1px solid #e5e7eb; padding: .6em .8em; text-align: left; }
        .reader-body th { background: #f1f5f9; font-weight: 700; color: #374151; }
        .reader-body tr:nth-child(even) td { background: #fafafa; }
        .reader-body em { color: #4b5563; }
        #chapterList a.active { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; font-weight: 700; }
        .chap-btn { transition: all .15s; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-5 py-3 flex items-center gap-4">
            <button onclick="goBack()" class="w-9 h-9 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-600 transition" title="Back to library">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="min-w-0 flex-1">
                <h1 id="bookTitle" class="font-bold text-gray-800 truncate text-sm">Loading...</h1>
                <p id="bookMeta" class="text-xs text-gray-500 truncate"></p>
            </div>
            <div class="hidden sm:flex items-center gap-1">
                <button onclick="adjustFont(-1)" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-600 font-bold" title="Smaller text">A-</button>
                <button onclick="adjustFont(1)" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-600 font-bold" title="Larger text">A+</button>
                <button onclick="toggleTheme()" id="themeBtn" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-600" title="Reading theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="w-28">
                <div class="flex items-center justify-between text-[10px] font-bold text-gray-500 mb-1">
                    <span>PROGRESS</span><span id="progressPct">0%</span>
                </div>
                <div class="h-1.5 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-indigo-600 rounded-full transition-all" style="width:0%"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-5 py-6 flex gap-6">
        <!-- Chapter sidebar -->
        <aside class="hidden lg:block w-64 shrink-0">
            <div class="bg-white border border-gray-200 rounded-lg p-4 sticky top-20">
                <p class="text-[10px] font-black uppercase text-gray-400 mb-3">Chapters</p>
                <div id="chapterList" class="space-y-1 max-h-[70vh] overflow-y-auto"></div>
            </div>
        </aside>

        <!-- Reading area -->
        <main class="flex-1 min-w-0">
            <article id="chapterContent" class="bg-white border border-gray-200 rounded-lg p-8 md:p-12 reader-body">
                <p class="text-gray-400">Loading chapter...</p>
            </article>

            <!-- Chapter navigation -->
            <div class="flex items-center justify-between gap-3 mt-5">
                <button id="prevBtn" onclick="goChapter(-1)" class="px-5 py-2.5 rounded-lg bg-white border border-gray-200 text-sm font-bold text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    <i class="fas fa-arrow-left mr-2"></i>Previous
                </button>
                <button id="nextBtn" onclick="goChapter(1)" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold transition">
                    Next<i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        </main>
    </div>

    <script src="js/reader.js"></script>
</body>
</html>
