server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy (frontends default to localhost:5000, but keep this for
    # deployments that use relative /api URLs).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO upgrade + transport.
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA-style fallback for known pages.
    location ~ ^/(index|login|student|faculty|staff|admin|parent)\.html$ {
        try_files $uri $uri.html /index.html;
    }
}