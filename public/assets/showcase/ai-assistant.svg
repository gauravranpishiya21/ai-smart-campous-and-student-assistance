<text x="280" y="150" font-size="26" fill="#f8fafc" font-weight="800" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >AI Study Planner &amp; Doubt Solver</text><text x="280" y="174" font-size="13" fill="#64748b" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Ask anything — get a personalised plan instantly</text><rect x="1010" y="128" width="180" height="40" rx="20" fill="url(#ac-a)" /><text x="1100" y="153" font-size="13" fill="#fff" font-weight="800" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" text-anchor="middle">● Live</text><rect x="280" y="196" width="600" height="524" rx="16" fill="#111c36" stroke="#ffffff" stroke-opacity=".07"/><rect x="520" y="222" width="330" height="66" rx="16" fill="url(#ac-a)" /><text x="538" y="250" font-size="13.5" fill="#fff" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >My exams start in 3 weeks. I am weak in</text><text x="538" y="272" font-size="13.5" fill="#fff" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Deep Learning. Target CGPA is 9.2.</text><rect x="302" y="312" width="470" height="132" rx="16" fill="#16213f" stroke="#ffffff" stroke-opacity=".08"/><text x="320" y="340" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Here is your 21-day plan 🎯</text><text x="320" y="362" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >• Mon–Sat 9–4:30 college, 4h self-study</text><text x="320" y="384" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >• Deep Learning: 90 min daily, weeks 1–2</text><text x="320" y="406" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >• Mock test every Sunday · revision week 3</text><rect x="560" y="468" width="290" height="44" rx="16" fill="url(#ac-a)" /><text x="578" y="496" font-size="13.5" fill="#fff" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Explain backpropagation simply</text><rect x="302" y="536" width="500" height="112" rx="16" fill="#16213f" stroke="#ffffff" stroke-opacity=".08"/><text x="320" y="564" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Think of it as blame assignment: the network</text><text x="320" y="586" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >guesses, measures its error, then walks backward</text><text x="320" y="608" font-size="13.5" fill="#e2e8f0" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >nudging each weight by how much it contributed.</text><rect x="302" y="664" width="556" height="40" rx="20" fill="#0b1224" stroke="#ffffff" stroke-opacity=".1"/><text x="324" y="689" font-size="13" fill="#64748b" font-weight="600" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Ask the AI…</text><circle cx="836" cy="684" r="14" fill="url(#ac-a)"/><rect x="900" y="196" width="290" height="250" rx="16" fill="#111c36" stroke="#ffffff" stroke-opacity=".07"/><text x="920" y="230" font-size="15" fill="#f1f5f9" font-weight="800" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >This week’s plan</text><text x="920" y="266" font-size="12" fill="#cbd5e1" font-weight="700" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Deep Learning</text><rect x="920" y="276" width="250" height="10" rx="5" fill="#0b1224" /><rect x="920" y="276" width="210" height="10" rx="5" fill="url(#ac-a)" /><text x="920" y="310" font-size="12" fill="#cbd5e1" font-weight="700" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" >Cyber Security</text><rect x="920" y="320" width="2